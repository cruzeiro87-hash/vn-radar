name: 뉴스 수집

on:
  schedule:
    - cron: "17 * * * *"      # 매시간 17분 (UTC 기준, 정각 혼잡 시간 피함)
  workflow_dispatch:           # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write     # 매주 기록 파일 커밋 (60일 자동 정지 방지)
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install feedparser==6.0.11 deep-translator==1.11.4

      - id: pages
        uses: actions/configure-pages@v5

      - name: 지난 수집 데이터 이어받기
        run: |
          mkdir -p data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data.json" -o data/news_data.json \
            || echo "첫 실행: 이전 데이터 없음"

      - name: 뉴스 수집·번역
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python news_widget.py --collect --web

      - name: 매주 월요일 기록 남기기 (GitHub 60일 자동 정지 방지)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
        run: |
          if { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%-H)" -lt 3 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p keepalive
            date -u +%Y-%m-%dT%H:%MZ > keepalive/last-run.txt
            git config user.name "radar-bot"
            git config user.email "radar-bot@users.noreply.github.com"
            git add keepalive/last-run.txt
            git diff --cached --quiet || git commit -m "keepalive $(date -u +%Y-%m-%d)"
            git push || echo "기록 커밋 실패 (수집에는 영향 없음)"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
